# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: BackEnd/package-lock.json

      - name: Install Backend dependencies
        run: npm install
        working-directory: BackEnd

      - name: Run Backend tests
        run: npm test
        working-directory: BackEnd
        env:
          NODE_ENV: test

          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_ACCESS_EXPIRES: 15m
          JWT_REFRESH_EXPIRES: 7d

          CLIENT_URL: ${{ secrets.CLIENT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_STORAGE_BUCKET: medicine-images

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}

          BCRYPT_ROUNDS: ${{ secrets.BCRYPT_ROUNDS }}

          REDIS_URL: ${{ secrets.REDIS_URL }}

          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}

          VNP_TMN_CODE: ${{ secrets.VNP_TMN_CODE }}
          VNP_HASH_SECRET: ${{ secrets.VNP_HASH_SECRET }}
          VNP_URL: ${{ secrets.VNP_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}

          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_CUSTOMER_EMAIL: ${{ secrets.TEST_CUSTOMER_EMAIL }}
          TEST_CUSTOMER_PASSWORD: ${{ secrets.TEST_CUSTOMER_PASSWORD }}

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install Frontend dependencies
        run: npm install
        working-directory: FrontEnd

      - name: Build Frontend
        run: npm run build
        working-directory: FrontEnd
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
